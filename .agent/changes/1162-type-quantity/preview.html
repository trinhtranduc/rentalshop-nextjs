<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Nhập số lượng — sheet bàn số</title>
<style>
  :root {
    --blue: #1D4EFD;
    --text: #0F172A;
    --muted: #64748B;
    --line: #E2E8F0;
    --chip: #F1F5F9;
    --bg: #F8FAFC;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    background: #E8EDF5;
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    padding: 28px 20px 48px;
  }
  h1 { font-size: 20px; margin: 0 0 6px; }
  .lead { margin: 0 0 22px; color: var(--muted); max-width: 720px; line-height: 1.45; }
  .phone {
    width: 320px;
    height: 640px;
    background: #fff;
    border-radius: 36px;
    border: 10px solid #0F172A;
    box-shadow: 0 18px 40px rgba(15, 23, 42, .18);
    overflow: hidden;
    position: relative;
    display: flex;
    flex-direction: column;
  }
  .status {
    height: 28px;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 22px 4px;
    font-size: 12px;
    font-weight: 600;
  }
  .nav {
    height: 48px;
    display: flex;
    align-items: center;
    padding: 0 16px;
    font-weight: 700;
    font-size: 17px;
    border-bottom: 1px solid var(--line);
  }
  .nav span { color: var(--blue); font-weight: 600; font-size: 15px; margin-right: 10px; }
  .body { flex: 1; background: var(--bg); padding: 12px 0; }
  .card { background: #fff; padding: 14px 16px; }
  .item { display: flex; gap: 12px; }
  .thumb {
    width: 64px; height: 64px; border-radius: 12px; background: var(--chip);
    flex: none; display: grid; place-items: center; color: #94A3B8; font-size: 22px;
  }
  .name { font-weight: 700; font-size: 16px; }
  .link { color: var(--blue); font-size: 14px; margin-top: 4px; }
  .foot { display: flex; align-items: center; margin-top: 10px; }
  .money { font-weight: 700; font-size: 16px; flex: 1; }
  .stepper {
    display: flex; align-items: center;
    border: 1px solid var(--line); border-radius: 10px; height: 38px; background: #fff;
  }
  .stepper button {
    width: 44px; height: 38px; border: 0; background: transparent;
    font-size: 20px; color: var(--text); cursor: pointer;
  }
  .qty {
    min-width: 44px; height: 38px; border: 0; background: transparent;
    font-size: 17px; font-weight: 600; cursor: pointer; color: var(--text);
  }
  .caption { margin-top: 10px; font-size: 13px; color: #334155; width: 320px; }
  .scrim {
    position: absolute; inset: 0; background: rgba(15, 23, 42, .32);
    display: none; align-items: flex-end;
  }
  .scrim.on { display: flex; }
  .sheet {
    width: 100%;
    background: #fff;
    border-radius: 16px 16px 0 0;
    padding-bottom: 12px;
  }
  .grabber {
    width: 36px; height: 5px; border-radius: 3px; background: #C7C7CC;
    margin: 8px auto 0;
  }
  .sheet h2 { margin: 20px 16px 8px; text-align: center; font-size: 17px; }
  .value {
    height: 65px; display: flex; align-items: center; justify-content: center;
    font-size: 48px; font-weight: 700;
  }
  .pad { display: grid; grid-template-columns: 1fr 1fr 1fr; }
  .pad button {
    height: 58px; border: 0.5px solid #E2E8F0; background: #fff;
    font-size: 22px; font-weight: 700; cursor: pointer;
  }
  .confirm {
    margin: 16px 16px 8px; height: 50px; border: 0; border-radius: 12px;
    background: var(--blue); color: #fff; font-size: 17px; font-weight: 600; cursor: pointer;
    width: calc(100% - 32px);
  }
</style>
</head>
<body>
  <h1>Nhập số lượng — sheet bàn số</h1>
  <p class="lead">Cùng sheet với giá, cọc và giảm giá. Bấm số giữa − và +. Vuốt xuống để giữ số cũ. Xác nhận ghi số mới.</p>
  <div class="phone" id="phone">
    <div class="status"><span>9:41</span><span>▮▮▮</span></div>
    <div class="nav"><span>‹</span> Giỏ hàng</div>
    <div class="body">
      <div class="card">
        <div class="item">
          <div class="thumb">👕</div>
          <div style="flex:1">
            <div class="name">Áo dài đỏ</div>
            <div class="link">450.000/lần</div>
            <div class="foot">
              <div class="money" id="money">450.000</div>
              <div class="stepper">
                <button type="button" id="minus">−</button>
                <button type="button" class="qty" id="qty" aria-label="Nhập số lượng">1</button>
                <button type="button" id="plus">+</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <div class="scrim on" id="scrim">
      <div class="sheet" role="dialog" aria-labelledby="dlgTitle">
        <div class="grabber"></div>
        <h2 id="dlgTitle">Nhập số lượng</h2>
        <div class="value" id="shown">1</div>
        <div class="pad" id="pad"></div>
        <button type="button" class="confirm" id="ok">Xác nhận</button>
      </div>
    </div>
  </div>
  <div class="caption">Phím 000 và ⌫ giống sheet tiền. Số đang có được thay khi bấm phím đầu tiên.</div>
<script>
  const price = 450000;
  let cart = 1;
  let raw = "1";
  let fresh = true;
  const qty = document.getElementById("qty");
  const money = document.getElementById("money");
  const shown = document.getElementById("shown");
  const scrim = document.getElementById("scrim");
  function vnd(n) { return n.toLocaleString("vi-VN"); }
  function paint() {
    qty.textContent = String(cart);
    money.textContent = vnd(price * cart);
    shown.textContent = Number(raw).toLocaleString("vi-VN");
  }
  function press(key) {
    const base = fresh ? "0" : raw;
    fresh = false;
    if (key === "⌫") raw = (base.length <= 1) ? "0" : base.slice(0, -1);
    else if (key === "000") raw = base === "0" ? "0" : (base + "000").slice(0, 12);
    else raw = (base === "0" ? key : base + key).slice(0, 12);
    paint();
  }
  const pad = document.getElementById("pad");
  [["1","2","3"],["4","5","6"],["7","8","9"],["0","000","⌫"]].forEach(row => {
    row.forEach(k => {
      const b = document.createElement("button");
      b.type = "button";
      b.textContent = k;
      b.onclick = () => press(k);
      pad.appendChild(b);
    });
  });
  qty.onclick = () => { raw = String(cart); fresh = true; paint(); scrim.classList.add("on"); };
  scrim.onclick = (e) => { if (e.target === scrim) scrim.classList.remove("on"); };
  document.getElementById("ok").onclick = () => {
    let n = Math.min(9999, parseInt(raw, 10) || 0);
    if (n === 0) n = 0;
    else cart = n;
    paint();
    scrim.classList.remove("on");
  };
  document.getElementById("minus").onclick = () => { if (cart > 1) { cart -= 1; paint(); } };
  document.getElementById("plus").onclick = () => { cart += 1; paint(); };
  paint();
</script>
</body>
</html>
